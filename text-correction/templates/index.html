<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proofread — text correction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fa;--panel:#fff;--ink:#14213d;--mute:#5d6b82;--line:#d9e0ea;--del:#c1121f;--fix:#1746c4;--fixbg:#e6edff;--ctx:#8a4b00;--ctxbg:#fff0d6}
@media(prefers-color-scheme:dark){:root{--bg:#0f1524;--panel:#171f33;--ink:#e8ecf5;--mute:#93a0b8;--line:#2a3550;--del:#ff6b76;--fix:#8fb0ff;--fixbg:#22335f;--ctx:#ffc36b;--ctxbg:#4a3512}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif}
header{max-width:1100px;margin:0 auto;padding:32px 20px 8px}
h1{font:600 2rem/1.1 "Source Serif 4",Georgia,serif;margin:0 0 6px}
header p{margin:0;color:var(--mute);max-width:60ch}
main{max-width:1100px;margin:0 auto;padding:16px 20px 48px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;min-height:340px}
h2{font-size:.95rem;margin:0 0 10px;font-weight:600}
textarea,#out{flex:1;width:100%;min-height:240px;font:400 1.1rem/1.7 "Source Serif 4",Georgia,serif;color:var(--ink);background:transparent;border:0;outline:0;resize:vertical;white-space:pre-wrap}
textarea:focus-visible{outline:2px solid var(--fix);outline-offset:4px;border-radius:4px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
button{font:600 .9rem "Instrument Sans",sans-serif;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--fix);border-color:var(--fix);color:#fff}
@media(prefers-color-scheme:dark){button.primary{color:#0f1524}}
button:focus-visible,.mk:focus-visible{outline:2px solid var(--fix);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.mk{cursor:pointer;border:0;background:none;padding:0;font:inherit;color:inherit}
.mk .old{color:var(--del);text-decoration:line-through;text-decoration-thickness:1.5px}
.mk .new{background:var(--fixbg);color:var(--fix);border-bottom:2px solid var(--fix);padding:0 2px;border-radius:3px}
.mk.context .new{background:var(--ctxbg);color:var(--ctx);border-color:var(--ctx)}
.stats{color:var(--mute);font-size:.85rem;margin-left:auto}
#pop{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);display:none;z-index:5;max-width:260px}
#pop small{display:block;color:var(--mute);margin-bottom:6px}
#pop button{margin:2px 4px 2px 0;padding:4px 10px}
.empty,.err{color:var(--mute)}.err{color:var(--del)}
</style></head><body>
<header><h1>Proofread</h1><p>Paste text. Misspellings, wrong-word slips (their/there), repeated words and a/an errors are fixed using the surrounding words as context.</p></header>
<main>
<section><h2>Your text</h2>
<textarea id="in" spellcheck="false" placeholder="Type or paste text to check">i went to a apple store tomorow and recieve my new phone. Their going to the the park definately becuase the weather is beutiful.</textarea>
<div class="bar"><button class="primary" id="go">Check text</button><button id="clr">Clear</button></div></section>
<section><h2>Corrections</h2>
<div id="out" class="empty" aria-live="polite">Corrections appear here. Select a mark to see other suggestions.</div>
<div class="bar"><button id="copy" disabled>Copy corrected text</button><span class="stats" id="stats"></span></div></section>
</main>
<div id="pop" role="dialog"></div>
<script>
const $=id=>document.getElementById(id);let cur=null,picks={};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  const {original:t,changes:cs}=cur;let h="",p=0;
  cs.forEach((c,i)=>{const n=picks[i]??c.corrected;h+=esc(t.slice(p,c.start));
    h+=`<button class="mk ${c.type==='context'?'context':''}" data-i="${i}" title="${c.type}"><span class="old">${esc(c.original)}</span> <span class="new">${esc(n)||'(removed)'}</span></button>`;p=c.end});
  $("out").className="";$("out").innerHTML=h+esc(t.slice(p));
  const k={};cs.forEach(c=>k[c.type]=(k[c.type]||0)+1);
  $("stats").textContent=cs.length?cs.length+" change"+(cs.length>1?"s":"")+": "+Object.entries(k).map(([a,b])=>b+" "+a).join(", "):"No changes";
}
function finalText(){const {original:t,changes:cs}=cur;let o="",p=0;
  cs.forEach((c,i)=>{o+=t.slice(p,c.start)+(picks[i]??c.corrected);p=c.end});return (o+t.slice(p)).replace(/ {2,}/g," ").replace(/ +([,.;:!?])/g,"$1")}
$("go").onclick=async()=>{
  const text=$("in").value;$("go").disabled=true;
  try{const r=await fetch("/api/correct",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");
    cur=d;picks={};render();$("copy").disabled=false;
  }catch(e){$("out").className="err";$("out").textContent=e.message;$("copy").disabled=true}
  $("go").disabled=false};
$("clr").onclick=()=>{$("in").value="";$("out").className="empty";$("out").textContent="Corrections appear here. Select a mark to see other suggestions.";$("stats").textContent="";$("copy").disabled=true;pop.style.display="none"};
$("copy").onclick=async()=>{await navigator.clipboard.writeText(finalText());$("copy").textContent="Copied";setTimeout(()=>$("copy").textContent="Copy corrected text",1200)};
const pop=$("pop");
$("out").onclick=e=>{const b=e.target.closest(".mk");if(!b){pop.style.display="none";return}
  const i=+b.dataset.i,c=cur.changes[i],r=b.getBoundingClientRect();
  pop.innerHTML=`<small>${c.type}</small>`+c.suggestions.map(s=>`<button data-i="${i}" data-s="${esc(s)}">${esc(s)||'(remove)'}</button>`).join("")+`<button data-i="${i}" data-s="${esc(c.original)}">Keep original</button>`;
  pop.style.display="block";pop.style.left=Math.min(r.left+scrollX,innerWidth-280)+"px";pop.style.top=r.bottom+scrollY+6+"px"};
pop.onclick=e=>{const b=e.target.closest("button");if(!b)return;picks[b.dataset.i]=b.dataset.s;pop.style.display="none";render()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")pop.style.display="none"});
</script></body></html>
